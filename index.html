<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <!-- Aplica el tema guardado antes de pintar (misma clave que src/hooks/useTema.ts) -->
  <script>
    try {
      var guardado = localStorage.getItem('esquema-color');
      if (guardado === 'light' || guardado === 'dark') {
        document.querySelector('meta[name="color-scheme"]').content = guardado;
      }
    } catch (e) {}
  </script>
  <title>Pulso · Administración del negocio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
</head>
<body>
  <div id="raiz"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
