# Publica la rama datos-de-prueba en GitHub Pages (https://dexter-mouser.github.io/pulso/)
name: Publicar en GitHub Pages

on:
  push:
    branches: [datos-de-prueba]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  RUTA_BASE: /pulso/

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npx tsc --noEmit

      - name: Compilar con la ruta del repositorio
        run: npx vite build --base="$RUTA_BASE"

      # La página de error enlaza al inicio del sitio publicado
      - name: Ajustar enlace de 404.html
        run: sed -i "s#href=\"/\"#href=\"$RUTA_BASE\"#" dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
